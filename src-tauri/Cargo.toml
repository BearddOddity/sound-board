[package]
name = "sound-board"
version = "0.1.0"
description = "Trigger sound effects and clips during your stream"
authors = ["BearddOddity"]
edition = "2021"

[lib]
name = "sound_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"


[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
